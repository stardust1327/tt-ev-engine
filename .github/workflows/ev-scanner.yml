# TT Cup table-tennis scanner (BetsAPI) - every 15 minutes on a GitHub-hosted runner,
# started by scan-timer.yml (live) or by hand from the Actions tab.
# MLB / NFL run separately in us-sports-scanner.yml.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   Secrets   BETSAPI_TOKEN, DISCORD_WEBHOOK_URL
#             LEDGER_TOKEN (optional) turns on the accuracy tracker: a fine-grained token with
#             "Contents: Read and write" on a private ledger repo (default <owner>/tt-ev-ledger,
#             or set the LEDGER_REPO variable). See README › Tracking accuracy.
#   Variables optional overrides of the defaults in ev_engine/config.py,
#             e.g. EV_THRESHOLD=0.03 or BET_BOOKS=Bet365,Betway
# Unset variables expand to "" and the engine falls back to its defaults.
# Until the secrets exist, runs finish green with an "idle" warning instead of failing.

name: TT Cup EV Scanner

# Run titles in the Actions list say what each run was; the Scan Timer only counts
# "TT Cup scan" runs, so manual dry runs and tests never hold back a live scan.
run-name: >-
  ${{ inputs.test_alert && 'TT Cup test alert'
  || inputs.inspect_odds && 'TT Cup odds diagnostics'
  || inputs.dry_run && 'TT Cup scan (dry run)'
  || inputs.report_now && 'TT Cup report card and scan'
  || 'TT Cup scan' }}

on:
  # No schedule here: scan-timer.yml starts this every 15 minutes with dry_run=false.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: log the alerts in the job output instead of posting"
        type: boolean
        default: true
      test_alert:
        description: "Only post one sample alert to check the Discord webhook"
        type: boolean
        default: false
      inspect_odds:
        description: "Diagnostics: show the raw odds for the next 3 matches (no alerts)"
        type: boolean
        default: false
      report_now:
        description: "Post the accuracy tracker's report card to Discord now (needs dry run off)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ev-scanner        # scans share alert state, so never run two at once
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Timer runs pass dry_run=false and post for real; manual runs follow the inputs.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      SEND_TEST_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert || false }}
      INSPECT_ODDS: ${{ github.event_name == 'workflow_dispatch' && inputs.inspect_odds || false }}
      REPORT_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.report_now || false }}
      # Accuracy tracker ledger: a private repo, <owner>/tt-ev-ledger unless LEDGER_REPO says otherwise.
      LEDGER_REPO: ${{ vars.LEDGER_REPO || format('{0}/tt-ev-ledger', github.repository_owner) }}
    steps:
      - name: Check secrets
        id: ready
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LEDGER_TOKEN: ${{ secrets.LEDGER_TOKEN }}
        run: |
          missing=""
          if [ "$SEND_TEST_ALERT" != "true" ] && [ -z "$BETSAPI_TOKEN" ]; then missing="$missing BETSAPI_TOKEN"; fi
          if [ "$DRY_RUN" != "true" ] && [ "$INSPECT_ODDS" != "true" ] && [ -z "$DISCORD_WEBHOOK_URL" ]; then missing="$missing DISCORD_WEBHOOK_URL"; fi
          if [ -n "$missing" ]; then
            echo "::warning title=Scanner idle::Add these repository secrets to start scanning:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          # The tracker only follows real scans: dry runs, test alerts and diagnostics post nothing.
          if [ "$DRY_RUN" = "true" ] || [ "$SEND_TEST_ALERT" = "true" ] || [ "$INSPECT_ODDS" = "true" ]; then
            echo "ledger=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$LEDGER_TOKEN" ]; then
            echo "::notice title=Tracker off::Add a LEDGER_TOKEN secret to track alert accuracy in $LEDGER_REPO (README › Tracking accuracy)."
            echo "ledger=false" >> "$GITHUB_OUTPUT"
          else
            echo "ledger=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out code
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.ready.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # Alert de-duplication. Cache keys are immutable, so every run saves a new entry
      # and restores the newest one by prefix. GitHub evicts entries unused for 7 days.
      - name: Restore alert state
        if: steps.ready.outputs.ready == 'true'
        uses: actions/cache/restore@v5
        with:
          path: .state
          key: ev-alert-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ev-alert-state-

      # Accuracy tracker: check out the private ledger repo. If this fails, the scan still runs
      # and alerts as usual; only the tracking is skipped (and flagged on the run page).
      - name: Check out the ledger
        id: ledger
        if: steps.ready.outputs.ready == 'true' && steps.ready.outputs.ledger == 'true'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ env.LEDGER_REPO }}
          token: ${{ secrets.LEDGER_TOKEN }}
          path: ledger

      - name: Flag a ledger problem
        if: steps.ledger.outcome == 'failure'
        run: >-
          echo "::warning title=Tracker off::Could not check out $LEDGER_REPO. Check that the repo exists and is not
          empty (create it with a README), and that LEDGER_TOKEN has Contents: Read and write on it and hasn't expired."

      - name: Scan for +EV edges
        if: steps.ready.outputs.ready == 'true'
        env:
          # --- secrets (encrypted by GitHub, masked in logs, never in code) ---
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # --- this workflow only scans TT Cup; MLB/NFL have their own workflow ---
          ENABLED_PROVIDERS: betsapi_tt
          # --- tunables: set any of these under Settings → Secrets and variables → Variables ---
          EV_THRESHOLD: ${{ vars.EV_THRESHOLD }}
          STRONG_EV_THRESHOLD: ${{ vars.STRONG_EV_THRESHOLD }}
          MAX_EV: ${{ vars.MAX_EV }}
          DEVIG_METHOD: ${{ vars.DEVIG_METHOD }}
          FAIR_LINE_MODE: ${{ vars.FAIR_LINE_MODE }}
          # BetsAPI often has only Bet365 and DraftKings fresh for a TT Cup match, too few for a
          # consensus. So DraftKings is priced against Bet365's no-vig line whenever Bet365 is fresh;
          # Bet365 itself still needs a consensus of 2 other books. The tracker's "By fair line"
          # table shows how these alerts do. FAIR_LINE_MODE=consensus switches it off.
          SHARP_BOOKS: ${{ vars.SHARP_BOOKS || 'Bet365' }}
          # BetsAPI carries ~3 books for TT Cup (DraftKings, Bet365, FonBet), so the engine-wide
          # default of 3 OTHER books can never be met here. 2 = price each book against the
          # average of the other two. 1 = more alerts, but one stale book can fake an edge.
          MIN_CONSENSUS_BOOKS: ${{ vars.MIN_CONSENSUS_BOOKS || '2' }}
          MAX_OVERROUND: ${{ vars.MAX_OVERROUND }}
          MIN_ODDS: ${{ vars.MIN_ODDS }}
          MAX_ODDS: ${{ vars.MAX_ODDS }}
          # BetsAPI re-checks DraftKings' TT prices in bulk about every 15-20 minutes, so a 10-minute
          # window drops DraftKings from over half of the scans. 20 keeps it in about 3 of 4 while still
          # skipping the long gaps (30-60 min). The tracker's "By price age at alert" table shows whether
          # the 10-20 minute alerts hold up; set the variable to 10 to go back.
          MAX_ODDS_AGE_MIN: ${{ vars.MAX_ODDS_AGE_MIN || '20' }}
          # Your sportsbooks. Of these, BetsAPI's TT Cup feed carries DraftKings and Bet365 today;
          # the others are listed so they count if it adds them. Other books still feed the fair line.
          BET_BOOKS: ${{ vars.BET_BOOKS || 'DraftKings,Bet365,FanDuel,BetMGM,Caesars,HardRockBet,BallyBet' }}
          MAX_ALERTS_PER_RUN: ${{ vars.MAX_ALERTS_PER_RUN }}
          TT_LEAGUES: ${{ vars.TT_LEAGUES }}
          BETSAPI_LEAGUE_IDS: ${{ vars.BETSAPI_LEAGUE_IDS }}
          BETSAPI_MARKETS: ${{ vars.BETSAPI_MARKETS }}
          BETSAPI_LOOKAHEAD_MIN: ${{ vars.BETSAPI_LOOKAHEAD_MIN }}
          DISCORD_USERNAME: ${{ vars.DISCORD_USERNAME || 'EV Engine · TT Cup' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          # --- accuracy tracker (on only when the ledger checked out) ---
          LEDGER_DIR: ${{ steps.ledger.outcome == 'success' && 'ledger' || '' }}
          LEDGER_URL: ${{ github.server_url }}/${{ env.LEDGER_REPO }}
          SETTLE_AFTER_MIN: ${{ vars.SETTLE_AFTER_MIN }}
          SETTLE_GIVE_UP_HOURS: ${{ vars.SETTLE_GIVE_UP_HOURS }}
          TRACKER_MAX_CALLS: ${{ vars.TRACKER_MAX_CALLS }}
          REPORT_DAY: ${{ vars.REPORT_DAY }}
          REPORT_HOUR_UTC: ${{ vars.REPORT_HOUR_UTC }}
        run: python -m ev_engine

      # Commit whatever the tracker wrote (new alerts, graded matches, REPORT.md). If the push
      # fails, nothing is lost: the next run starts from the last saved ledger and redoes it.
      - name: Save the ledger
        if: always() && steps.ledger.outcome == 'success'
        working-directory: ledger
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Ledger unchanged."; exit 0; fi
          git -c user.name="tt-ev-engine" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Ledger update $(date -u '+%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            if git push -q; then echo "Ledger saved."; exit 0; fi
            git pull -q --rebase || break
          done
          echo "::warning title=Ledger not saved::Could not push to $LEDGER_REPO. Check that LEDGER_TOKEN still has Contents: Read and write (tokens expire). The next run redoes this one's grading."

      - name: Save alert state
        if: always() && steps.ready.outputs.ready == 'true'
        uses: actions/cache/save@v5
        with:
          path: .state
          key: ev-alert-state-${{ github.run_id }}-${{ github.run_attempt }}
